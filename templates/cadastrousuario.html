<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO DE USUÁRIO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="static/style.css">
    <link rel="icon" href="static/senailogo2.jpg" type="image/jpeg">
</head>
<body>
    
    <form id="formusuario" action="/cadastrousuario" method="POST">
        {% if erro %}
        <div style="color: red; margin-bottom: 15px; font-weight: bold;">
            {{ erro }}
        </div>
        {% endif %}

        <label>Nome de Usuário:</label><br>
        <input type="text" name="usuario" required><br><br>
        
        <label>Senha:</label><br>
        <input type="password" name="senha" required><br><br>

        <label>Tipo de Conta:</label><br>
        <select id="tipo" name="tipo" style="padding: 6px; border-radius: 4px; margin-bottom: 15px;" onchange="verificarTipo()">
            <option value="usuario">Usuário Comum</option>
            <option value="adm">Administrador</option>
        </select><br><br>

        <div id="campo_mestra" style="display: none;">
            <label>Senha Mestra do ADM:</label><br>
            <input type="password" name="senha_mestra" placeholder="Digite a chave mestra"><br><br>
        </div>
        
        <button type="submit">Cadastrar</button>
        <br><br>
        <a href="/login">Já tem conta? Voltar para o Login</a>
    </form>

    <script>
        function verificarTipo() {
            var tipo = document.getElementById("tipo").value;
            var campoMestra = document.getElementById("campo_mestra");
            if (tipo === "adm") {
                campoMestra.style.display = "block";
            } else {
                campoMestra.style.display = "none";
            }
        }
    </script>
</body>
</html>
